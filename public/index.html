<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Pop</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="description" content="Pop colorful bubbles, practice numbers, and collect surprise prizes!">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            touch-action: manipulation;
            transition: background 0.5s ease;
        }

        #score {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 48px;
            font-weight: bold;
            color: #ff6b6b;
        }

        #cameraButton {
            position: fixed;
            bottom: 10px;
            left: 10px;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50%;
            font-size: 50px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        #cameraButton:active {
            transform: scale(0.9);
        }

        #photoInput {
            display: none;
        }

        #gameArea {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #prizeCollection {
            position: fixed;
            bottom: 0;
            left: 100px;
            right: 0;
            height: 100px;
            background: rgba(255, 255, 255, 0.9);
            border-top: 5px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px;
            gap: 15px;
            overflow-x: auto;
            z-index: 100;
            scroll-behavior: smooth;
        }

        .collected-prize {
            font-size: 60px;
            animation: prizeFloat 1s ease-out;
            flex-shrink: 0;
        }

        @keyframes prizeFloat {
            0% {
                transform: translateY(-200px) scale(0);
                opacity: 0;
            }
            50% {
                transform: translateY(-100px) scale(1.3);
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 5px solid rgba(255, 255, 255, 0.5);
            animation: float 2s ease-in-out infinite;
            transition: transform 0.1s;
        }

        .bubble:active {
            transform: scale(0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .pop-effect {
            position: absolute;
            font-size: 80px;
            pointer-events: none;
            animation: popAnim 0.5s ease-out forwards;
            z-index: 999;
        }

        @keyframes popAnim {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            animation: celebrate 1s ease-out;
            pointer-events: none;
            z-index: 1001;
        }

        @keyframes celebrate {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            animation: sparkleAnim 1s ease-out forwards;
        }

        @keyframes sparkleAnim {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.1);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fall {
            to {
                transform: translateY(120vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="score">
        <span>⭐</span>
        <span id="scoreNumber">0</span>
    </div>
    <button id="cameraButton" aria-label="Choose a photo for face bubbles" title="Photos stay on this device">📷</button>
    <input type="file" id="photoInput" accept="image/*" capture="user">
    <div id="gameArea"></div>
    <div id="prizeCollection"></div>

    <script>
        let score = 0;
        let prizePending = false;
        let bubbleId = 0;
        let nextPrizeAt = Math.floor(Math.random() * 4) + 10; // Random between 10-13
        let prizes = [];
        let selfiePhoto = null; // Store the selfie
        const gameArea = document.getElementById('gameArea');
        const scoreNumber = document.getElementById('scoreNumber');
        const cameraButton = document.getElementById('cameraButton');
        const photoInput = document.getElementById('photoInput');

        // Load saved photo from localStorage
        try {
            selfiePhoto = localStorage.getItem('numberPopSelfie');
        } catch {
            // The game also works when browser storage is unavailable.
        }

        // Camera button click
        cameraButton.addEventListener('click', function() {
            photoInput.click();
        });

        // Handle photo selection
        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Create canvas to crop to circle and resize
                    const canvas = document.createElement('canvas');
                    const size = 200; // Thumbnail size
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    // Draw circular crop
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();

                    // Calculate aspect ratio crop (center square)
                    const minDim = Math.min(img.width, img.height);
                    const sx = (img.width - minDim) / 2;
                    const sy = (img.height - minDim) / 2;

                    // Draw image centered and cropped
                    ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);

                    // Save to localStorage
                    selfiePhoto = canvas.toDataURL('image/jpeg', 0.8);
                    try {
                        localStorage.setItem('numberPopSelfie', selfiePhoto);
                    } catch {
                        // Keep the photo for this session if storage is full or disabled.
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        const backgroundColors = [
            'linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%)',
            'linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffd89b 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 50%, #43e97b 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 50%, #30cfd0 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #ffecd2 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffc3a0 100%)',
            'linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff6e7f 100%)',
            'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 50%, #667eea 100%)'
        ];
        let currentBgIndex = 0;

        // Change background when tapping empty space
        gameArea.addEventListener('click', function(e) {
            // Only change if clicking the game area itself, not a bubble
            if (e.target === gameArea) {
                currentBgIndex = (currentBgIndex + 1) % backgroundColors.length;
                document.body.style.background = backgroundColors[currentBgIndex];
            }
        });

        const emojis = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🐦', '🦆', '🦉', '🦋', '🐝', '🐞', '🐌', '🦄', '🐙', '🦀', '🐠', '🐟', '🐡', '🦈', '🐳', '🐬', '⭐', '✨', '💫', '🌟', '💝', '💖', '💗', '💓', '💕', '🎈', '🎉', '🎊', '🎁', '🏆', '🥇', '🌈', '☀️', '🌙', '⚡', '🍎', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍒', '🍑', '🥝'];

        const colors = [
            'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
            'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
            'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
            'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
            'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
            'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
            'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)',
            'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)',
            'linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)',
            'linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%)'
        ];

        function createBubble() {
            if (prizePending) return;
            const bubble = document.createElement('button');
            bubble.type = 'button';
            bubble.className = 'bubble';
            bubble.id = `bubble-${bubbleId++}`;
            
            const size = Math.random() * 50 + 80;
            const x = Math.random() * Math.max(0, gameArea.clientWidth - size - 40) + 20;
            const y = Math.random() * Math.max(0, gameArea.clientHeight - size - 240) + 120;
            
            // 30% chance of face bubble if selfie exists
            const isFaceBubble = selfiePhoto && Math.random() < 0.3;
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            bubble.setAttribute('aria-label', isFaceBubble ? 'Pop your photo bubble' : 'Pop bubble');
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = x + 'px';
            bubble.style.top = y + 'px';
            bubble.style.background = color;
            
            if (isFaceBubble) {
                // Create face bubble
                bubble.style.backgroundImage = `url(${selfiePhoto})`;
                bubble.style.backgroundSize = 'cover';
                bubble.style.backgroundPosition = 'center';
                bubble.innerHTML = '';
            } else {
                // Regular emoji bubble
                const emoji = emojis[Math.floor(Math.random() * emojis.length)];
                bubble.textContent = emoji;
            }
            
            bubble.addEventListener('click', function(e) {
                e.stopPropagation();
                popBubble(bubble, isFaceBubble ? '😊' : bubble.textContent, x + size/2, y + size/2);
            });
            
            gameArea.appendChild(bubble);
            
            setTimeout(() => {
                if (bubble.parentNode) {
                    bubble.style.transition = 'opacity 0.5s';
                    bubble.style.opacity = '0';
                    setTimeout(() => {
                        if (bubble.parentNode) {
                            bubble.remove();
                        }
                    }, 500);
                }
            }, 3000);
        }

        function popBubble(bubble, emoji, x, y) {
            if (!bubble.parentNode) return;
            
            score++;
            scoreNumber.textContent = score;
            
            // Create pop effect
            const popEffect = document.createElement('div');
            popEffect.className = 'pop-effect';
            popEffect.textContent = emoji;
            popEffect.style.left = x + 'px';
            popEffect.style.top = y + 'px';
            gameArea.appendChild(popEffect);
            
            setTimeout(() => popEffect.remove(), 500);
            
            // Create sparkles
            for (let i = 0; i < 5; i++) {
                createSparkle(x, y);
            }
            
            // Show prize at random milestone!
            if (score === nextPrizeAt) {
                prizePending = true;
                clearInterval(spawnInterval);
                gameArea.querySelectorAll('.bubble').forEach(b => b.remove());
                setTimeout(() => showPrize(), 500);
            }
            // Celebration every 5 pops
            else if (score % 5 === 0) {
                celebrate();
            }
            
            bubble.remove();
        }

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 100 + 50;
            sparkle.style.setProperty('--x', Math.cos(angle) * distance + 'px');
            sparkle.style.setProperty('--y', Math.sin(angle) * distance + 'px');
            
            gameArea.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 1000);
        }

        function celebrate() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = '🎉';
            document.body.appendChild(celebration);
            
            setTimeout(() => celebration.remove(), 1000);
        }

        function showPrize() {
            // Pick a random prize emoji
            const prizeEmoji = emojis[Math.floor(Math.random() * emojis.length)];

            // Pause bubble spawning
            clearInterval(spawnInterval);
            
            // Remove all existing bubbles
            const existingBubbles = document.querySelectorAll('.bubble');
            existingBubbles.forEach(b => b.remove());
            
            // Add confetti
            const confettiInterval = setInterval(() => createConfetti(), 100);
            
            // Create bouncing number (no bubble, just text)
            const bouncingNumber = document.createElement('div');
            bouncingNumber.id = 'bouncingNumber';
            bouncingNumber.style.cssText = `
                position: fixed;
                font-size: 100px;
                font-weight: bold;
                color: #ffd700;
                text-shadow: 4px 4px 8px rgba(0,0,0,0.4), 0 0 20px rgba(255,215,0,0.6);
                z-index: 2000;
                pointer-events: none;
                user-select: none;
            `;
            bouncingNumber.textContent = score;
            
            // Random starting position (upper 60% of screen to avoid keyboard area)
            let x = Math.random() * (window.innerWidth - 200) + 50;
            let y = Math.random() * (window.innerHeight * 0.6 - 200) + 50;
            let vx = (Math.random() - 0.5) * 8; // velocity x
            let vy = (Math.random() - 0.5) * 8; // velocity y
            
            bouncingNumber.style.left = x + 'px';
            bouncingNumber.style.top = y + 'px';
            
            document.body.appendChild(bouncingNumber);
            
            // Animate bouncing
            const bounceInterval = setInterval(() => {
                x += vx;
                y += vy;
                
                // Bounce off edges (stay in upper 60% of screen)
                const maxHeight = window.innerHeight * 0.6;
                if (x <= 0 || x >= window.innerWidth - 200) vx = -vx;
                if (y <= 0 || y >= maxHeight - 150) vy = -vy;
                
                bouncingNumber.style.left = x + 'px';
                bouncingNumber.style.top = y + 'px';
            }, 30);
            
            // Create input container with arrows
            const inputContainer = document.createElement('div');
            inputContainer.style.cssText = `
                position: fixed;
                bottom: 120px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                align-items: center;
                gap: 15px;
                z-index: 2001;
            `;
            
            // Left arrow
            const leftArrow = document.createElement('div');
            leftArrow.style.cssText = `
                font-size: clamp(30px, 9vw, 60px);
                animation: flash 1s ease-in-out infinite;
            `;
            leftArrow.textContent = '👉';
            
            // Input field
            const input = document.createElement('input');
            input.type = 'tel';
            input.id = 'prizeInput';
            input.inputMode = 'numeric';
            input.pattern = '[0-9]*';
            input.setAttribute('aria-label', 'Type the bouncing number to collect your prize');
            input.setAttribute('placeholder', score.toString());
            input.style.cssText = `
                width: min(200px, 48vw);
                height: 100px;
                border: 6px solid #ffd700;
                background: rgba(255, 255, 255, 0.98);
                text-align: center;
                font-size: 70px;
                font-weight: bold;
                color: #333;
                border-radius: 20px;
                outline: none;
                box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            `;
            
            // Right arrow
            const rightArrow = document.createElement('div');
            rightArrow.style.cssText = `
                font-size: clamp(30px, 9vw, 60px);
                animation: flash 1s ease-in-out infinite;
            `;
            rightArrow.textContent = '👈';
            
            // Add flashing animation
            const style = document.createElement('style');
            style.textContent = `
                @keyframes flash {
                    0%, 100% { opacity: 1; transform: scale(1); }
                    50% { opacity: 0.3; transform: scale(1.2); }
                }
                #prizeInput::placeholder {
                    color: #999;
                    opacity: 1;
                }
            `;
            document.head.appendChild(style);
            
            inputContainer.appendChild(leftArrow);
            inputContainer.appendChild(input);
            inputContainer.appendChild(rightArrow);
            document.body.appendChild(inputContainer);
            
            function positionAnswer() {
                const viewport = window.visualViewport;
                const keyboardHeight = viewport ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop) : 0;
                inputContainer.style.bottom = (keyboardHeight > 0 ? keyboardHeight + 16 : 120) + 'px';
            }
            window.visualViewport?.addEventListener('resize', positionAnswer);
            positionAnswer();

            // Try to auto-focus (may or may not trigger keyboard depending on browser)
            setTimeout(() => {
                input.focus();
                input.click();
            }, 100);
            
            // Another attempt after a delay
            setTimeout(() => {
                input.focus();
            }, 500);
            
            // Check answer as they type
            input.addEventListener('input', function() {
                const enteredValue = this.value.trim();
                if (enteredValue === String(score)) {
                    // Correct!
                    this.blur();
                    clearInterval(bounceInterval);
                    clearInterval(confettiInterval);
                    
                    // Stop the number and show prize emoji
                    bouncingNumber.textContent = prizeEmoji;
                    bouncingNumber.style.fontSize = '120px';
                    bouncingNumber.style.color = '#667eea';
                    bouncingNumber.style.animation = 'bounce 0.5s ease-in-out 3';
                    
                    // Remove input container
                    window.visualViewport?.removeEventListener('resize', positionAnswer);
                    inputContainer.remove();
                    style.remove();
                    
                    setTimeout(() => {
                        // Add prize to collection
                        const prizeCollection = document.getElementById('prizeCollection');
                        const collectedPrize = document.createElement('div');
                        collectedPrize.className = 'collected-prize';
                        collectedPrize.textContent = prizeEmoji;
                        prizeCollection.appendChild(collectedPrize);
                        prizes.push(prizeEmoji);
                        
                        // Scroll to show the newest prize
                        prizeCollection.scrollLeft = prizeCollection.scrollWidth;
                        
                        // Remove bouncing number
                        bouncingNumber.style.transition = 'all 0.5s ease-out';
                        bouncingNumber.style.transform = 'scale(0)';
                        bouncingNumber.style.opacity = '0';
                        
                        setTimeout(() => {
                            bouncingNumber.remove();
                            // Set next random prize milestone
                            nextPrizeAt = score + Math.floor(Math.random() * 4) + 10;
                            // Resume spawning
                            prizePending = false;
                            spawnInterval = setInterval(createBubble, 800);
                        }, 500);
                    }, 1500);
                }
            });
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            const confettiEmojis = ['🎊', '🎉', '⭐', '✨', '💫', '🌟', '🎈', '🎁'];
            confetti.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
            confetti.style.cssText = `
                position: fixed;
                font-size: 40px;
                left: ${Math.random() * 100}%;
                top: -50px;
                z-index: 2001;
                pointer-events: none;
                animation: fall ${Math.random() * 3 + 3}s linear forwards;
            `;
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 6000);
        }

        window.addEventListener('resize', () => {
            gameArea.querySelectorAll('.bubble').forEach(b => b.remove());
        });

        // Spawn bubbles regularly
        let spawnInterval = setInterval(createBubble, 800);
        
        // Start with a few bubbles
        for (let i = 0; i < 3; i++) {
            setTimeout(createBubble, i * 300);
        }
    </script>
</body>
</html>
